<div class="container">
    <div class="game-info">
        <p>Taille de la map: {{ mapSize() }} x {{ mapSize() }}</p>
        <p>Joueurs: {{ playerCount() }}</p>
        <p>Joueur actif: <strong>{{ activePlayer()?.name ?? '—' }}</strong></p>
    </div>
    @if (isDebugMode()) {
        <div class="debug-indicator">
            <p class="debug-indicator">Mode débogage actif</p>
        </div>
    }
    <div class="player-list">
        <app-player-list></app-player-list>
    </div>
    <div class="chatbox"></div>
</div>
