@if (popupService.show()) {
    <app-popup [show]="true">
        <p>{{ popupService.message() }}</p>
        <button class="button" (click)="popupService.close()">Fermer</button>
    </app-popup>
}
@if (popupService.notificationShow()) {
    <div class="combat-notification-container" aria-live="polite">
        <div class="combat-notification" role="status">
            <p>{{ popupService.notificationMessage() }}</p>
            <button type="button" class="combat-notification__close" (click)="popupService.closeNotification()">Masquer</button>
        </div>
    </div>
}

<app-choice-popup
    [show]="popupService.choiceShow()"
    [title]="popupService.choiceTitle()"
    [message]="popupService.choiceMessage()"
    [firstOptionLabel]="popupService.choiceFirstOptionLabel()"
    [secondOptionLabel]="popupService.choiceSecondOptionLabel()"
    (firstOptionSelected)="popupService.selectChoiceFirstOption()"
    (secondOptionSelected)="popupService.selectChoiceSecondOption()"
    (closeRequested)="popupService.closeChoice()">
</app-choice-popup>

<div class="container">
    <div class="map-game-section">
        <app-map-game></app-map-game>
    </div>
    <div class="left-game-sidebar">
        <app-left-sidebar></app-left-sidebar>
        <app-zone-de-message></app-zone-de-message>
    </div>
    <div class="right-game-sidebar">
        <app-right-sidebar></app-right-sidebar>
    </div>
</div>
