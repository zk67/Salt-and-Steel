<div class="games-create">
    <header class="create-header">
        <div class="create-header-content">
            <h1 class="title">Joindre une partie</h1>
            <h2 class="sous-title">Choisissez une partie disponible</h2>
        </div>
    </header>

    <button class="btn-back" routerLink="/home">← Retour</button>

    <section class="list-frame">
        @if (joinableGames().length === 0) {
            <p class="empty-state">Aucune partie disponible pour le moment.</p>
        } @else {
            <div class="games-list">
                @for (entry of joinableGames(); track entry.roomId) {
                    <article class="joinable-entry">
                        <app-game-card [game]="entry.game" (click)="selectGame(entry.roomId)"></app-game-card>
                        <p class="waiting-count">Joueurs en attente : {{ entry.playerCount }} / {{ entry.game.maxPlayers }}</p>
                    </article>
                }
            </div>
        }
    </section>
</div>
