<div class="page-container">
  <header class="page-header">
    <h1>Liste des jeux</h1>
  </header>

  <div class="page-content">
    <div class="game-list">
      @for (game of games; track game._id) {
        <app-game-card [game]="game"></app-game-card>
      }
    </div>

    <div class="buttons">
      <button class="button" routerLink="/">Retour</button>
    </div>
  </div>
</div>
